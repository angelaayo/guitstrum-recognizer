<!doctype html>
<html>
  <head>
    <title>Mic Test</title>
  </head>
  <body>
    <button id="recordBtn" type="button">Start Recording</button>
    <p id="status">Idle</p>
    <p id="result"></p>

    <script>
      let mediaRecorder;
      let chunks = [];
      const btn = document.getElementById("recordBtn");
      const status = document.getElementById("status");
      const result = document.getElementById("result");

      btn.addEventListener("click", async () => {
        if (btn.textContent === "Start Recording") {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
          mediaRecorder = new MediaRecorder(stream);
          chunks = [];

          mediaRecorder.ondataavailable = (e) => chunks.push(e.data);

          mediaRecorder.onstop = async () => {
            console.log("Recording stopped. Chunks collected:", chunks.length);
            status.textContent = "Sending to recognizer...";
            const blob = new Blob(chunks, { type: "audio/webm" });
            console.log("Blob size:", blob.size, "bytes");

            const formData = new FormData();
            formData.append("audio", blob, "recording.webm");

            try {
              const res = await fetch("http://127.0.0.1:8000/recognize", {
                method: "POST",
                body: formData,
              });
              console.log("Response status:", res.status);

              const data = await res.json();
              console.log("Response data:", data);

              result.textContent = "Detected chord: " + data.detectedChord;
              status.textContent = "Done";
            } catch (err) {
              console.error("Fetch failed:", err);
              status.textContent = "Error — check console";
            }
          };

          mediaRecorder.start();
          btn.textContent = "Stop Recording";
          status.textContent = "Recording... (play your chord now)";
        } else {
          mediaRecorder.stop();
          btn.textContent = "Start Recording";
        }
      });
    </script>
  </body>
</html>
